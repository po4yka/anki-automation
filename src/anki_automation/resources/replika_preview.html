<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Реплика — предпросмотр карточек Anki</title>
<style>/* REPLIKA_CSS */

.demo { max-width: 37.5rem; margin-inline: auto; }
.demo-header { display: grid; gap: 10px; padding-block-end: 12px; }
.demo-header h1 { margin: 0; font-size: clamp(1.9rem, 7vw, 2.8rem); line-height: 1.1; }
.demo-header p { margin: 0; color: var(--muted); font-size: .93rem; }
.demo-theme { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: .9rem; }
.demo-theme select { min-height: 36px; padding-inline: 8px; border: 1px solid var(--input-line);
  border-radius: 7px; color: var(--text); background: var(--panel); font: inherit; }
.demo-example { margin-block-start: 24px; }
.demo-example > h2 { margin: 0 0 8px; font-size: .9rem; font-weight: 700; }
.demo-example > h2 span { color: var(--muted); font-weight: 500; }
.demo-answer { margin-block-start: 6px; }
.demo-answer > summary { padding-block: 8px; min-height: 28px; cursor: pointer; color: var(--accent); }
.demo-answer[open] > summary { margin-block-end: 6px; }
.demo :is(select, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body class="card">
<main class="demo">
  <header class="demo-header">
    <h1>Реплика</h1>
    <p>Задания на контекст, пропуск и точный ответ. Сравнение ввода доступно во время повторения в Anki.</p>
    <label class="demo-theme">Тема <select id="theme">
      <option value="system">Системная</option>
      <option value="light">Светлая</option>
      <option value="dark">Тёмная</option>
    </select></label>
  </header>
<!-- REPLIKA_CARDS -->
</main>
<script>
const theme = document.getElementById('theme');
const systemTheme = matchMedia('(prefers-color-scheme: dark)');
function updateTheme() {
  const dark = theme.value === 'dark' || (theme.value === 'system' && systemTheme.matches);
  document.body.classList.toggle('nightMode', dark);
}
theme.addEventListener('change', updateTheme);
systemTheme.addEventListener('change', updateTheme);
updateTheme();
</script>
</body>
</html>

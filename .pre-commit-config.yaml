minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ty
        name: Type check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: uv-lock
        name: Lock file check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

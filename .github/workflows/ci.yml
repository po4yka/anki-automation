name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  UV_PYTHON_DOWNLOADS: automatic

jobs:
  quality:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
      - run: uv run --locked pre-commit run --all-files

  tests:
    name: Tests (${{ matrix.os }}, Python 3.15)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked
      - run: uv run --locked pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Build and install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv python install
      - run: uv build
      - name: Install wheel in a clean environment and run CLI
        run: |
          uv run --isolated --no-project --python 3.15 --with ./dist/*.whl anki-automation validate examples/cards.jsonl
          uv run --isolated --no-project --python 3.15 --with ./dist/*.whl anki-automation anki methods --group media
      - name: Install source distribution in a clean environment and run CLI
        run: |
          uv run --isolated --no-project --python 3.15 --with ./dist/*.tar.gz anki-automation validate examples/cards.jsonl
          uv run --isolated --no-project --python 3.15 --with ./dist/*.tar.gz anki-automation anki methods --group media

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          version: "3.99.8"
          extra_args: --results=verified,unknown

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[project]
name = "anki-automation"
version = "0.2.0"
description = "Prepare checked language-learning notes and import them into Anki."
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt", "NOTICE"]
authors = [{ name = "po4yka" }]
dependencies = ["jsonschema>=4.26.0,<5"]

[project.urls]
Repository = "https://github.com/po4yka/anki-automation"
Issues = "https://github.com/po4yka/anki-automation/issues"

[project.scripts]
anki-automation = "anki_automation.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0,<5",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.5,<0.18",
    "ty>=0.0.102,<0.0.103",
]

[tool.uv]
required-version = ">=0.13.7,<0.14"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.15"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["anki_automation"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
